<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChacingX Shipment Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            padding: 20px;
        }
        h1 {
            color: #00f5d4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1c2541;
        }
        th, td {
            border: 1px solid #48cae4;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4cc9f0;
            color: #0b132b;
        }
    </style>
</head>
<body>

    <h1>Data Resi ChacingX</h1>
    <p>Daftar resi hasil scan dari APK tim gudang secara real-time:</p>

    <!-- Wadah untuk tabel resi -->
    <div id="tabel-resi">
        <p>Memuat data resi dari database...</p>
    </div>

    <!-- SCRIPT FIREBASE (HARUS DI DALAM TAG INI AGAR BERFUNGSI) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Project ChacingX Anda
        const firebaseConfig = {
          apiKey: "MASUKKAN_API_KEY_ANDA",
          authDomain: "chacingx-1cdb0.firebaseapp.com",
          projectId: "ChacingX",
          storageBucket: "chacingx-1cdb0.appspot.com",
          messagingSenderId: "ID_ANDA",
          appId: "ID_APLIKASI_ANDA"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Ambil data resi secara real-time dari collection 'data_resi'
        const q = query(collection(db, "data_resi"), orderBy("waktu_scan", "desc"));

        onSnapshot(q, (snapshot) => {
          let htmlContent = "";
          
          if (snapshot.empty) {
            htmlContent = `<p>Belum ada resi yang di-scan.</p>`;
          } else {
            htmlContent = `<table>
                            <tr>
                              <th>No. Resi</th>
                              <th>Waktu</th>
                              <th>Status</th>
                            </tr>`;
            snapshot.forEach((doc) => {
              let data = doc.data();
              let waktuFormat = data.waktu_scan ? new Date(data.waktu_scan.toDate()).toLocaleString() : '-';
              htmlContent += `<tr>
                                <td>${data.resi || '-'}</td>
                                <td>${waktuFormat}</td>
                                <td>${data.status || 'Masuk Gudang'}</td>
                              </tr>`;
            });
            htmlContent += `</table>`;
          }

          // Masukkan ke elemen dengan id="tabel-resi"
          document.getElementById("tabel-resi").innerHTML = htmlContent;
        });
    </script>

</body>
</html>
